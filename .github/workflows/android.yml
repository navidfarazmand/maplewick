# Builds the Android test app (mobile/) on GitHub's computers, for free, with no Expo or Google Play account.
# The APK is signed with React Native's standard test key: fine for installing on your own phone, not for Google Play.
# It appears as the "Android test build" release: https://github.com/navidfarazmand/maplewick/releases/tag/android-test
# Runs when mobile/ changes on main, or by hand: Actions → Android test build → Run workflow.
name: Android test build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        working-directory: mobile
        run: npm ci

      - name: Make the Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name it
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/release/app-release.apk out/maplewick-test.apk
          echo "Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC')" > out/notes.txt

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: maplewick-test-apk
          path: out/maplewick-test.apk

      - name: Publish as the "Android test build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test out/maplewick-test.apk \
            --title "Android test build" \
            --notes "$(cat out/notes.txt). Open this page on your Android phone, tap maplewick-test.apk and install it. Not for Google Play." \
            --prerelease --target "$GITHUB_SHA"
